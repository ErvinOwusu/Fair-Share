spring.application.name=fairshare-backend

# Supply these through the IDE or deployment environment, not source control.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Manage schema changes with SQL migrations; Hibernate only validates the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Supabase Auth verifies the caller's access token before household creation.
supabase.auth.url=${SUPABASE_URL:https://svzusdhdiitywpibxnun.supabase.co}
supabase.auth.publishable-key=${SUPABASE_PUBLISHABLE_KEY:sb_publishable_TDgvUAMWU8dQfoLDmrnvuw_gX27md9q}
